name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Unit tests do not launch Electron; skip its 100 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: Package (${{ matrix.name }})
    # Build installers on pushes to main, release tags and manual runs.
    # Pull requests only run the unit tests so they stay fast.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: unit-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --win --x64
            artifacts: |
              dist/*.exe
              dist/*.blockmap
          - name: linux-x64
            os: ubuntu-latest
            args: --linux --x64
            artifacts: |
              dist/*.AppImage
              dist/*.deb
          - name: macos-arm64
            # Apple Silicon runner; sharp installs the arm64 native binary.
            os: macos-latest
            args: --mac --arm64
            artifacts: dist/*.dmg
          - name: macos-x64
            # Intel runner; sharp installs the x64 native binary.
            # macOS 15 Intel is also available as macos-15-intel.
            os: macos-26-intel
            args: --mac --x64
            artifacts: dist/*.dmg
    env:
      # Unsigned CI builds by default. Configure signing secrets and remove
      # this line when producing release-signed installers.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot libopenjp2-tools
      - run: npm ci
      - run: node scripts/vendor.js
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: editawr-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach packages to release
    # Only tags create/update a GitHub Release. Create the release first if you
    # want to write the notes yourself; otherwise this creates one.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: editawr-*
          merge-multiple: true
          path: release-assets
      - name: Attach installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh release-assets
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --title "${GITHUB_REF_NAME}" --generate-notes
          fi
